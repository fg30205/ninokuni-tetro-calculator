<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二之國 Tetro 拼圖計算器</title>
<meta name="description" content="內建 94 個二之國 Tetro 謎題，可依多項能力需求排列完整方案。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1020'/%3E%3Cpath d='M10 12h18v18h18v18H28V30H10z' fill='%237c5cff'/%3E%3Cpath d='M34 12h18v18H34z' fill='%232ee6a6'/%3E%3C/svg%3E">
<style>
:root{--bg:#070b14;--panel:#0e1527;--line:#26324e;--text:#eef2ff;--muted:#99a5bf;--violet:#7c5cff;--mint:#2ee6a6;--amber:#ffbe55}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#172248 0,transparent 32rem),var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1440px;margin:auto;padding:24px}.top,.brand,.card-head,.field-row{display:flex;align-items:center}.top{justify-content:space-between;gap:20px;margin-bottom:20px}.brand{gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:conic-gradient(from 90deg,var(--violet),#ad73ff,var(--mint));box-shadow:0 0 30px #7c5cff55}.brand h1{font-size:1.3rem;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:.875rem}.badge{border:1px solid #355074;background:#0b172b;color:#9bc7ff;border-radius:99px;padding:7px 11px;font-size:.78rem}
.layout{display:grid;grid-template-columns:330px minmax(360px,1fr) 390px;gap:16px}.card{background:linear-gradient(155deg,#11192cdd,#0c1221ee);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px #0005;overflow:hidden}.card-head{padding:17px 18px;border-bottom:1px solid var(--line);justify-content:space-between}.card h2{font-size:.95rem;margin:0}.section{padding:18px}.hint{font-size:.78rem;color:var(--muted);margin:0 0 14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.btn{border:1px solid #34415f;background:#17213a;color:var(--text);border-radius:10px;padding:9px 12px}.btn:hover{border-color:#65739a}.btn.primary{background:linear-gradient(135deg,var(--violet),#6243de);border-color:#947fff;font-weight:750}.btn.ghost{background:transparent}.field-row{gap:10px;margin:10px 0}.field-row label{color:var(--muted);font-size:.82rem;min-width:54px}.field-row input,.field-row select{min-width:0;width:100%;background:#080e1c;color:var(--text);border:1px solid #34415f;border-radius:9px;padding:9px}
#board{display:grid;gap:4px;width:min(100%,520px);aspect-ratio:1;margin:auto}.cell{border:1px solid #394868;background:#16213b;border-radius:5px;min-width:0;padding:0}.cell.off{background:#090d16;border-color:#171e2e}.cell.filled{border-color:#ffffff35;box-shadow:inset 0 0 0 1px #ffffff20}.board-wrap{padding:20px;display:grid;place-items:center;min-height:450px}.board-meta{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 16px}
.piece-list{display:grid;gap:9px;max-height:480px;overflow:auto}.piece{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:9px;background:#0a1120;border:1px solid #25314b;border-radius:12px;padding:9px}.mini{display:grid;grid-template-columns:repeat(4,9px);grid-template-rows:repeat(4,9px);gap:2px}.mini i{background:#1d2943;border-radius:2px}.mini i.on{background:var(--pc)}.piece strong{font-size:.85rem;display:block}.piece span{font-size:.72rem;color:var(--muted)}
.sort-options{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.sort-option{display:flex;align-items:center;gap:6px;border:1px solid #34415f;background:#0a1120;color:var(--muted);border-radius:99px;padding:6px 10px}.sort-option b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#1b2740;color:#99a5bf;font-size:.72rem}.sort-option.selected{border-color:var(--violet);background:#24204b;color:var(--text);box-shadow:inset 0 0 0 1px #7c5cff55}.sort-option.selected b{background:var(--violet);color:#fff}.sort-actions{display:flex;gap:7px;margin:8px 0}.sort-actions .btn{padding:6px 9px;font-size:.75rem}.sort-note{font-size:.72rem;color:var(--muted);margin:0 0 12px}.solve-tools{display:flex;align-items:center;gap:8px}.mode-select{background:#080e1c;color:var(--text);border:1px solid #34415f;border-radius:10px;padding:9px 30px 9px 10px}.limits{display:grid;gap:7px;margin:10px 0 14px;padding:12px;background:#090f1d;border:1px solid #293650;border-radius:12px}.limits[hidden]{display:none}.limit-row{display:grid;grid-template-columns:1fr 70px 70px;align-items:center;gap:7px}.limit-row span{font-size:.78rem}.limit-row input{width:100%;min-width:0;background:#111a2f;color:var(--text);border:1px solid #34415f;border-radius:7px;padding:7px;text-align:center}.limit-head{color:var(--muted);font-size:.7rem}.mode-help{margin-top:7px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:#0a1120;border:1px solid #25314b;border-radius:11px;padding:10px}.stat span{font-size:.68rem;color:var(--muted);display:block}.stat b{font-size:1.1rem}.progress{height:5px;background:#1b2540;border-radius:9px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--mint));transition:.2s}.results{display:grid;gap:8px;max-height:430px;overflow:auto}.result{width:100%;text-align:left;border:1px solid #293650;background:#0a1120;color:var(--text);border-radius:11px;padding:11px}.result:hover,.result.active{border-color:var(--violet);background:#151638}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.chip{font-size:.68rem;padding:3px 6px;border-radius:6px;background:#1c2945;color:#c4cee5}.empty{text-align:center;padding:48px 16px;color:var(--muted)}.score{float:right;color:var(--mint)}.notice{font-size:.75rem;color:var(--amber);margin-top:10px}.footer{text-align:center;color:#65708b;font-size:.75rem;padding:20px}@media(max-width:1100px){.layout{grid-template-columns:300px 1fr}.results-card{grid-column:1/-1}}@media(max-width:720px){.app{padding:12px}.top{align-items:flex-start}.top>.badge{display:none}.layout{grid-template-columns:1fr}.results-card{grid-column:auto}.board-wrap{min-height:340px}.brand p{display:none}}
</style>
</head>
<body>
<main class="app">
<header class="top">
<div class="brand">
<div class="logo">
</div>
<div>
<h1>二之國 Tetro 拼圖計算器</h1>
<p>94 個謎題 · 固定七種能力方塊</p>
</div>
</div>
<span class="badge">本機計算 · 不上傳資料</span>
</header>
<div class="layout">
<section class="card">
<div class="card-head">
<h2>01 · 選擇謎題</h2>
<button class="btn ghost" id="reset">重設</button>
</div>
<div class="section">
<div class="field-row">
<label>謎題</label>
<select id="puzzle">
</select>
</div>
<p class="hint" id="puzzleMeta">
</p>
<div class="toolbar">
<button class="btn" id="editBoard">自訂棋盤</button>
<button class="btn" id="savePuzzle">儲存自訂謎題</button>
<button class="btn" id="exportPuzzles">匯出自訂謎題</button>
</div>
</div>
</section>
<section class="card">
<div class="card-head">
<h2 id="puzzleName">02 · 棋盤</h2>
<span id="layoutNo" class="badge">尚未計算</span>
</div>
<div class="board-wrap">
<div id="board">
</div>
</div>
<div class="board-meta" id="boardMeta">
</div>
</section>
<section class="card results-card">
<div class="card-head">
<h2>03 · 計算結果</h2>
<div class="solve-tools">
<select class="mode-select" id="mode" aria-label="計算模式">
<option value="quick" selected>快速排序</option>
<option value="advanced">進階限制</option>
</select>
<button class="btn primary" id="solve">開始計算</button>
</div>
</div>
<div class="section">
<div class="stats">
<div class="stat">
<span>有效格數</span>
<b id="activeCount">0</b>
</div>
<div class="stat">
<span>能力組合</span>
<b id="solutionCount">0</b>
</div>
<div class="stat">
<span>搜尋節點</span>
<b id="nodeCount">0</b>
</div>
</div>
<div class="limits" id="limits" hidden>
</div>
<label class="hint">依序點選排序優先級</label>
<div class="sort-options" id="sortOptions">
<button class="sort-option" data-attr="ATK">
<b>
</b>
<span>攻擊</span>
</button>
<button class="sort-option" data-attr="DEF">
<b>
</b>
<span>防禦</span>
</button>
<button class="sort-option" data-attr="HP">
<b>
</b>
<span>生命</span>
</button>
<button class="sort-option" data-attr="CRIT">
<b>
</b>
<span>爆擊</span>
</button>
<button class="sort-option" data-attr="ACC">
<b>
</b>
<span>命中</span>
</button>
<button class="sort-option" data-attr="EVAS">
<b>
</b>
<span>迴避</span>
</button>
<button class="sort-option" data-attr="CRIT_RES">
<b>
</b>
<span>爆擊抵抗</span>
</button>
</div>
<div class="sort-actions">
<button class="btn ghost" id="clearSort">清除排序</button>
<button class="btn ghost" id="defaultSort">恢復綜合排序</button>
</div>
<p class="sort-note">第一次點擊會建立新的排序。例：依序點防禦、攻擊、生命，即為防禦 ＞ 攻擊 ＞ 生命。</p>
<div class="progress">
<i id="bar">
</i>
</div>
<div id="status" class="hint">
</div>
<div id="results" class="results">
<div class="empty">結果會顯示在這裡</div>
</div>
<p class="notice">相同能力數量只顯示一次；搜尋最多 1,500,000 個節點。</p>
</div>
</section>
</div>
<div class="footer">資料版本 1 · DFS + Backtracking · 僅允許旋轉</div>
</main>
<script src="data/puzzles.js">
</script>
<script src="app.js">
</script>
</body>
</html>
